<!doctype html>
<!-- 文資旅行地圖（guide/）的社群分享縮圖原稿。
     用瀏覽器以 1200×630、淺色模式開啟後截圖，存成 guide/og.jpg（見 README〈文資旅行地圖〉）。
     地圖圖形取自 guide/geo.js，網站數字要和 guide/index.html 一致。 -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>文資旅行地圖 分享縮圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../guide/guide.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color-scheme: light; }
  body { background: radial-gradient(700px 420px at 92% 10%, color-mix(in srgb, var(--mint) 80%, transparent), transparent 70%), radial-gradient(600px 300px at 0% 100%, color-mix(in srgb, var(--sun) 25%, transparent), transparent 70%), var(--paper); position: relative; font-family: var(--f-body); }
  .copy { position: absolute; left: 56px; top: 40px; width: 600px; }
  .eb { font-weight: 700; color: var(--hinoki); letter-spacing: .1em; font-size: 22px; margin: 0; }
  h1 { font-family: var(--f-display); font-size: 100px; line-height: 1.05; margin: 8px 0 12px; letter-spacing: .04em; }
  h1 span { color: var(--peach); }
  .sub { font-size: 27px; color: var(--ink); margin: 0 0 22px; line-height: 1.5; }
  .sub b { color: var(--teal); }
  .chips6 { display: grid; grid-template-columns: repeat(3, auto); gap: 10px; justify-content: start; }
  .chips6 span { font-family: var(--f-display); font-weight: 700; font-size: 23px; padding: 6px 14px 6px 12px; border-radius: 8px; background: var(--ticket); border: 2px solid var(--c); color: var(--c); border-left-width: 9px; }
  .url { position: absolute; left: 56px; bottom: 36px; margin: 0; font-size: 22px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
  .map { position: absolute; right: 200px; top: 22px; width: 400px; height: 560px; border: 3px solid var(--map-ink); border-radius: 18px; overflow: hidden; background: var(--sea); box-shadow: 0 18px 40px rgba(60, 40, 20, .2); transform: rotate(2.5deg); }
  .map svg { width: 100%; height: 100%; display: block; }
  .allan { position: absolute; right: 150px; bottom: 18px; height: 330px; filter: drop-shadow(0 10px 16px rgba(60, 40, 20, .25)); }
  .arale { position: absolute; right: 22px; bottom: 18px; height: 300px; filter: drop-shadow(0 10px 16px rgba(60, 40, 20, .25)); }
  .tiles { position: absolute; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
  <div class="copy">
    <p class="eb">Allan Lo 和你逛文化・全系列導覽</p>
    <h1>文資<span>旅行</span><br>地圖</h1>
    <p class="sub">Allan 和阿拉蕾帶你逛 <b>6 個文資網站</b><br>22 縣市・4,215 筆文化資產</p>
    <div class="chips6">
      <span style="--c:var(--k-knowledge)">文資知識網</span><span style="--c:var(--k-visit)">達人訪查</span><span style="--c:var(--k-rail)">搭火車逛文資</span>
      <span style="--c:var(--k-town)">鄉鎮性格卡</span><span style="--c:var(--k-ascent)">從海口到山頂</span><span style="--c:var(--k-atlas)">文資地圖集</span>
    </div>
  </div>
  <p class="url">cultural.123hi.org/guide</p>
  <div class="map"><svg id="m" preserveAspectRatio="xMidYMid slice"></svg></div>
  <img class="allan" src="../assets/characters/allan-wave.webp" alt="">
  <img class="arale" src="../assets/characters/arale-wave.webp" alt="">
  <div class="g-tiles tiles"></div>
<script src="../guide/geo.js"></script>
<script>
  var G = window.GUIDE_GEO, h = '<defs><pattern id="w" width="34" height="18" patternUnits="userSpaceOnUse"><path d="M2,12q6,-6 12,0t12,0" fill="none" stroke="var(--sea-line)" stroke-width="1"/></pattern></defs><rect width="' + G.w + '" height="' + G.h + '" fill="url(#w)"/>';
  G.main.forEach(function (d, i) { h += '<path class="' + (i ? "mp-band mp-l" + i : "mp-coast") + '" fill-rule="evenodd" d="' + d + '"/>'; });
  for (var r in G.rivers) h += '<path class="mp-river" d="' + G.rivers[r] + '"/>';
  for (var t in G.trails) h += '<path class="mp-trail" d="' + G.trails[t] + '"/>';
  h += '<path class="mp-rail" d="' + G.rail + '"/><path class="mp-rail-tie" d="' + G.rail + '"/>';
  G.pins.forEach(function (p) { if (p[0] !== "kinmen-county" && p[0] !== "lienchiang-county") h += '<circle cx="' + p[1] + '" cy="' + p[2] + '" r="7" style="fill:var(--peach);stroke:#fff;stroke-width:2.2"/>'; });
  var m = document.getElementById("m");
  m.setAttribute("viewBox", "150 0 " + (G.w - 150) + " " + G.h);
  m.innerHTML = h;
</script>
</body>
</html>
